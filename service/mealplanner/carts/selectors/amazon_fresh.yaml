# Selector pack for amazon.com Fresh / Whole Foods storefront.
# Each slot is an ORDERED fallback list — when the site redesigns, fixing a
# broken slot is a data edit here, not a code change. Prefer role/text
# selectors over brittle CSS where possible.
home_url: "https://www.amazon.com/"
# Your-Account URL: when logged out Amazon redirects it to a properly-formed
# sign-in page (hitting /ap/signin directly errors without flow params).
login_url: "https://www.amazon.com/gp/css/homepage.html"
cart_url: "https://www.amazon.com/cart"
signin_marker:
  # Present only when logged OUT — used by check_session. The homepage greeting
  # reads "Hello, sign in" when logged out and "Hello, <name>" when logged in.
  - "#nav-link-accountList:has-text('sign in')"
  - "form[name='signIn']"
  - "#ap_email"
account_marker:
  # Checked only after signin_marker misses, so bare presence is enough.
  - "#nav-link-accountList"
search_input:
  - "input#twotabsearchtextbox"
  - "input[type='search']"
result_card:
  - "[data-component-type='s-search-result']"
  - "[data-csa-c-item-id]"
result_title:
  - "h2 span"
  - ".a-text-normal"
add_button:
  - "button:has-text('Add to cart')"
  - "input[name='submit.addToCart']"
  - "[data-action='add-to-cart']"
